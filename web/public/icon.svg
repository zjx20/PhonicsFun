<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- PhonicsFun 应用图标。apple-touch-icon.png 由本文件的满幅版本（rx=0）
       栅格化而来（iOS 不认 SVG 且自己裁圆角），改图后需重新生成，见 web/README.md。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ee650e"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="180" height="180" rx="40"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="180" height="180" fill="url(#bg)"/>
    <!-- 左上柔光 -->
    <circle cx="42" cy="30" r="95" fill="#ffffff" opacity="0.14"/>
    <!-- 球杆式小写 a（幼儿手写体教学字形）：先投影后本体 -->
    <g fill="none" stroke-linecap="round">
      <g stroke="#a34406" opacity="0.3" transform="translate(0 5)">
        <circle cx="80" cy="110" r="30" stroke-width="17"/>
        <path d="M119 80 V 140" stroke-width="17"/>
      </g>
      <g stroke="#ffffff">
        <circle cx="80" cy="110" r="30" stroke-width="17"/>
        <path d="M119 80 V 140" stroke-width="17"/>
        <!-- 从 a 发出的两道声波 -->
        <path d="M148 76 A 29 29 0 0 0 119 47" stroke-width="9" opacity="0.9"/>
        <path d="M163 76 A 44 44 0 0 0 119 32" stroke-width="9" opacity="0.5"/>
      </g>
    </g>
    <!-- 星星点缀 -->
    <path d="M43 52 l4.5 10 10 4.5 -10 4.5 -4.5 10 -4.5 -10 -10 -4.5 10 -4.5 z" fill="#ffe9a8"/>
    <circle cx="150" cy="140" r="5" fill="#ffe9a8" opacity="0.9"/>
  </g>
</svg>
